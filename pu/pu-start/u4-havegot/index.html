// ==================== 工具函数 ====================
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(arr, n) { return shuffle(arr).slice(0, n); }

function tokenize(sentence) {
  return sentence.split(' ').reduce(function(acc, w) {
    var m = w.match(/^([^.!?]+)([.!?])$/);
    if (m) { acc.push(m[1]); acc.push(m[2]); }
    else acc.push(w);
    return acc;
  }, []);
}

function buildArrange(en, zh, type) {
  return { type: type, en: en, zh: zh, words: shuffle(tokenize(en)) };
}

function buildQuestion(en, zh) {
  var ans = (Math.random() < 0.5);
  return { type: 'question', en: en, zh: zh, words: shuffle(tokenize(en)), yesAnswer: ans };
}

function generateLevel1() { return pick(L1_RAW, 8).map(function(s){ return buildArrange(s, L1_ZH[s], 'arrange'); }); }
function generateLevel2() { return pick(L2_RAW, 8).map(function(s){ return buildArrange(s, L2_ZH[s], 'arrange'); }); }
function generateLevel3() { return pick(L3_RAW, 8).map(function(s){ return buildQuestion(s, L3_ZH[s]); }); }
function generateLevel4() { return pick(L4_DATA, 8).map(function(d){
  var q = { type: 'fill', zh: d.zh, seg: d.seg, blanks: d.blanks, opts: shuffle(d.opts),
    answers: d.blanks.map(function(i){ return d.seg[i]; }) };
  return q;
}); }
function generateLevel5() {
  var pool = [];
  pool = pool.concat(pick(L1_RAW, 2).map(function(s){ return buildArrange(s, L1_ZH[s], 'arrange'); }));
  pool = pool.concat(pick(L2_RAW, 2).map(function(s){ return buildArrange(s, L2_ZH[s], 'arrange'); }));
  pool = pool.concat(pick(L3_RAW, 2).map(function(s){ return buildQuestion(s, L3_ZH[s]); }));
  pool = pool.concat(pick(L4_DATA, 2).map(function(d){
    return { type: 'fill', zh: d.zh, seg: d.seg, blanks: d.blanks, opts: shuffle(d.opts),
      answers: d.blanks.map(function(i){ return d.seg[i]; }) };
  }));
  return shuffle(pool);
}

var LEVEL_META = [
  { key: 'l1', name: '肯定句连词成句', icon: '✅', gen: generateLevel1 },
  { key: 'l2', name: '否定句连词成句', icon: '❌', gen: generateLevel2 },
  { key: 'l3', name: '疑问句+回答', icon: '❓', gen: generateLevel3 },
  { key: 'l4', name: '选词填空', icon: '✏️', gen: generateLevel4 },
  { key: 'l5', name: '综合大挑战', icon: '🏆', gen: generateLevel5 }
];

var LEVELS = LEVEL_META.map(function(m){ return { meta: m, questions: m.gen() }; });

// ==================== 状态 ====================
var currentLevel = 0;
var currentQuestion = 0;
var score = 0;
var totalPoints = 0;
var answered = false;
var answerWords = [];
var fillSlots = [];
var STORAGE_KEY = 'pu_start_u4_havegot_v2';

function loadProgress() {
  try {
    var data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data && data.best) {
      for (var i = 0; i < data.best.length && i < LEVELS.length; i++) {
        if (data.best[i] != null) LEVELS[i].best = data.best[i];
      }
    }
  } catch(e) {}
  renderLevelSelect();
}
function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    best: LEVELS.map(function(l){ return l.best != null ? l.best : null; })
  }));
}

function isUnlocked(idx) {
  if (idx === 0) return true;
  var prev = LEVELS[idx - 1];
  return prev.best != null && prev.best.stars > 0;
}
function isCompleted(idx) {
  return LEVELS[idx].best != null;
}

function renderLevelSelect() {
  var el = document.getElementById('level-select');
  var html = '';
  LEVELS.forEach(function(l, i) {
    var unlocked = isUnlocked(i);
    var completed = isCompleted(i);
    var stars = completed ? l.best.stars : 0;
    html += '<div class="level-card' + (unlocked ? '' : ' locked') + (completed ? ' completed' : '') + '"' +
      (unlocked ? ' onclick="startLevel(' + i + ')"' : '') + '>' +
      '<div class="level-icon">' + l.meta.icon + '</div>' +
      '<div class="level-name">' + l.meta.name + '</div>' +
      '<div class="level-num">第 ' + (i + 1) + ' 关</div>' +
      '<div class="level-stars-mini">' + (stars ? '⭐'.repeat(stars) : (unlocked ? '·' : '🔒')) + '</div>' +
      '</div>';
  });
  el.innerHTML = html;
  var total = LEVELS.reduce(function(s, l){ return s + (l.best ? l.best.stars : 0); }, 0);
  document.getElementById('home-stars').textContent = '⭐'.repeat(Math.min(3, Math.ceil(total / LEVELS.length)));
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}
function goHome() { showPage('home-page'); renderLevelSelect(); }
function startGame() { startLevel(0); }

function startLevel(idx) {
  LEVELS[idx].questions = LEVELS[idx].meta.gen();
  currentLevel = idx;
  currentQuestion = 0;
  score = 0;
  totalPoints = 0;
  answered = false;
  document.getElementById('game-level-badge').textContent = '第 ' + (idx + 1) + ' 关 · ' + LEVELS[idx].meta.name;
  document.getElementById('game-stars').textContent = '⭐ 0';
  showPage('game-page');
  loadQuestion();
}

function questionMaxScore(q) {
  if (q.type === 'question') return 2; // 拼问句1 + 回答1
  return 1;
}

// ==================== 出题 ====================
function loadQuestion() {
  var level = LEVELS[currentLevel];
  var q = level.questions[currentQuestion];
  answered = false;
  answerWords = [];
  fillSlots = [];
  document.getElementById('progress-fill').style.width = (currentQuestion / level.questions.length * 100) + '%';
  document.getElementById('next-btn').classList.remove('show');
  document.getElementById('next-btn').textContent = '下一题 →';

  var qc = document.getElementById('question-container');
  var oc = document.getElementById('options-container');
  var ac = document.getElementById('answer-container');
  var pc = document.getElementById('wordpool-container');
  oc.innerHTML = ''; ac.innerHTML = ''; pc.innerHTML = '';

  if (q.type === 'arrange') {
    renderArrangeQuestion(q);
  } else if (q.type === 'question') {
    renderArrangeQuestion(q);
  } else if (q.type === 'fill') {
    renderFillQuestion(q);
  }
}

function renderArrangeQuestion(q) {
  var qc = document.getElementById('question-container');
  var ac = document.getElementById('answer-container');
  var pc = document.getElementById('wordpool-container');
  var hint = q.type === 'question' ? '先连词成句拼出问句' : '看中文提示，点击单词拼出正确句子';
  qc.innerHTML = '<div class="question-box">' +
    '<div class="chinese-hint">' + hint + '</div>' +
    '<div class="chinese-display">' + q.zh + '</div>' +
    '<button class="sound-btn" onclick="playCurrentSound()">🔊</button>' +
    '</div>';
  ac.innerHTML = '<div class="answer-area" id="answer-area"><span style="color: rgba(255,255,255,0.3); font-size: 14px;">点击下方单词开始组句...</span></div>';
  var poolHtml = '<div class="word-pool">';
  q.words.forEach(function(w, i) {
    poolHtml += '<span class="word-chip" data-word="' + w + '" data-idx="' + i + '" onclick="addWord(this)">' + w + '</span>';
  });
  poolHtml += '</div>';
  pc.innerHTML = poolHtml;
}

function renderFillQuestion(q) {
  var qc = document.getElementById('question-container');
  var ac = document.getElementById('answer-container');
  var pc = document.getElementById('wordpool-container');
  fillSlots = q.answers.map(function(){ return null; });
  var line = '';
  q.seg.forEach(function(seg, i) {
    if (q.blanks.indexOf(i) !== -1) {
      var bi = q.blanks.indexOf(i);
      line += '<span class="fill-slot" id="fill-slot-' + bi + '" onclick="clearFill(' + bi + ')">' + (bi + 1) + '</span>';
    } else if (/^[.!?]$/.test(seg)) {
      line += seg;
    } else {
      line += '<span style="margin:0 4px;">' + seg + '</span>';
    }
  });
  qc.innerHTML = '<div class="question-box">' +
    '<div class="chinese-hint">选择合适的单词填进方框，补全句子</div>' +
    '<div class="chinese-display" style="font-size:24px; margin-bottom:16px;">' + q.zh + '</div>' +
    '<div class="sentence-line">' + line + '</div>' +
    '<button class="sound-btn" onclick="playSoundFull()">🔊</button>' +
    '</div>';
  ac.innerHTML = '';
  var poolHtml = '<div class="word-pool">';
  q.opts.forEach(function(w, i) {
    poolHtml += '<span class="word-chip" data-w="' + w + '" data-idx="' + i + '" onclick="fillIn(this)">' + w + '</span>';
  });
  poolHtml += '</div>';
  pc.innerHTML = poolHtml;
}

function escapeHtmlAttr(s) { return s; }

// ==================== 连词成句 ====================
function addWord(el) {
  if (answered) return;
  if (el.classList.contains('used')) return;
  var word = el.dataset.word;
  if (!word) word = el.getAttribute('data-word');
  answerWords.push(word);
  el.classList.add('used');
  renderAnswer();
  var q = LEVELS[currentLevel].questions[currentQuestion];
  if (answerWords.length === q.words.length) checkArrange();
}

function removeWord(el) {
  if (answered) return;
  var idx = parseInt(el.dataset.i);
  var word = answerWords[idx];
  answerWords.splice(idx, 1);
  var chips = document.querySelectorAll('#wordpool-container .word-chip');
  for (var i = 0; i < chips.length; i++) {
    if (chips[i].getAttribute('data-word') === word && chips[i].classList.contains('used')) {
      chips[i].classList.remove('used');
      break;
    }
  }
  renderAnswer();
}

function renderAnswer() {
  var area = document.getElementById('answer-area');
  if (!area) return;
  area.classList.toggle('filled', answerWords.length > 0);
  if (answerWords.length === 0) {
    area.innerHTML = '<span style="color: rgba(255,255,255,0.3); font-size: 14px;">点击下方单词开始组句...</span>';
    return;
  }
  var html = '';
  answerWords.forEach(function(w, i) {
    html += '<span class="word-chip in-answer" data-i="' + i + '" onclick="removeWord(this)">' + w + '</span>';
  });
  area.innerHTML = html;
}

function normalize(str) {
  return str.replace(/\s+([.!?])/g, '$1').trim();
}

function checkArrange() {
  if (answered) return;
  var q = LEVELS[currentLevel].questions[currentQuestion];
  var area = document.getElementById('answer-area');
  var user = normalize(answerWords.join(' '));
  var correct = (user === q.en);

  if (correct) {
    score += 1;
    area.classList.add('right');
    document.getElementById('game-stars').textContent = '⭐ ' + score;
  } else {
    area.classList.add('wrong');
    var tip = document.createElement('div');
    tip.style.cssText = 'color:#2DD4BF; font-size:16px; font-weight:600; margin-top:10px; width:100%;';
    tip.textContent = '正确答案：' + q.en;
    area.appendChild(tip);
  }

  if (q.type === 'question') {
    // 进入回答阶段
    setTimeout(function(){ showYesNoStage(q, correct); }, correct ? 400 : 1200);
  } else if (q.type === 'arrange') {
    totalPoints += 1;
    answered = true;
    playSound(q.en);
    setTimeout(showNextBtn, 1000);
  }
}

function showYesNoStage(q, arrangeCorrect) {
  answered = true;
  var oc = document.getElementById('options-container');
  var stageLabel = q.yesAnswer ? '是的，我有 / 你是 / 有' : '不，我没有 / 你不是 / 没有';
  var ynHtml =
    '<div class="question-box" style="background: rgba(45,212,191,0.1);">' +
    '<div class="chinese-hint">根据上面问句，选择肯定或否定回答</div>' +
    '<div class="chinese-display" style="font-size:26px;">' + (q.yesAnswer ? '✅ 肯定' : '❌ 否定') + '</div>' +
    '</div>' +
    '<div class="yesno-options">' +
    '<button class="yesno-btn" onclick="checkYesNo(true, this)">✅<span class="yn-label">Yes</span></button>' +
    '<button class="yesno-btn" onclick="checkYesNo(false, this)">❌<span class="yn-label">No</span></button>' +
    '</div>';
  oc.innerHTML = ynHtml;
  totalPoints += 2; // 拼问句已计1分（在checkArrange里score+1），回答再加1分机会
  playSound(q.en);
}

function checkYesNo(userYes, btn) {
  var q = LEVELS[currentLevel].questions[currentQuestion];
  var btns = document.querySelectorAll('.yesno-btn');
  btns.forEach(function(b){ b.disabled = true; });
  if (userYes === q.yesAnswer) {
    btn.classList.add('correct');
    score += 1;
    document.getElementById('game-stars').textContent = '⭐ ' + score;
  } else {
    btn.classList.add('wrong');
    btns.forEach(function(b){
      var isYes = b.querySelector('.yn-label').textContent === 'Yes';
      if (isYes === q.yesAnswer) b.classList.add('correct');
    });
  }
  setTimeout(showNextBtn, 800);
}

// ==================== 选词填空 ====================
function fillIn(el) {
  if (answered) return;
  if (el.classList.contains('used')) return;
  var w = el.getAttribute('data-w');
  var emptySlot = fillSlots.indexOf(null);
  if (emptySlot === -1) return;
  fillSlots[emptySlot] = w;
  el.classList.add('used');
  var slotEl = document.getElementById('fill-slot-' + emptySlot);
  slotEl.textContent = w;
  slotEl.classList.add('filled');
  if (fillSlots.indexOf(null) === -1) checkFill();
}

function clearFill(idx) {
  if (answered) return;
  var w = fillSlots[idx];
  if (!w) return;
  fillSlots[idx] = null;
  var chips = document.querySelectorAll('#wordpool-container .word-chip');
  for (var i = 0; i < chips.length; i++) {
    if (chips[i].getAttribute('data-w') === w && chips[i].classList.contains('used')) {
      chips[i].classList.remove('used');
      break;
    }
  }
  var slotEl = document.getElementById('fill-slot-' + idx);
  slotEl.textContent = (idx + 1);
  slotEl.classList.remove('filled');
}

function checkFill() {
  if (answered) return;
  var q = LEVELS[currentLevel].questions[currentQuestion];
  var allRight = true;
  q.answers.forEach(function(ans, i) {
    var slotEl = document.getElementById('fill-slot-' + i);
    if (fillSlots[i] === ans) slotEl.classList.add('right');
    else { slotEl.classList.add('wrong'); allRight = false; }
  });
  totalPoints += 1;
  answered = true;
  if (allRight) {
    score += 1;
    document.getElementById('game-stars').textContent = '⭐ ' + score;
  } else {
    var qc = document.getElementById('question-container');
    var tip = document.createElement('div');
    tip.style.cssText = 'color:#2DD4BF; font-size:16px; font-weight:600; margin-top:8px;';
    tip.textContent = '正确答案：' + q.seg.join(' ');
    qc.appendChild(tip);
  }
  playSoundFull();
  setTimeout(showNextBtn, 1000);
}

function playSoundFull() {
  var q = LEVELS[currentLevel].questions[currentQuestion];
  playSound(q.seg.join(' '));
}

function playCurrentSound() {
  var q = LEVELS[currentLevel].questions[currentQuestion];
  playSound(q.en);
}

// ==================== 下一题 ====================
function showNextBtn() {
  var level = LEVELS[currentLevel];
  var btn = document.getElementById('next-btn');
  if (currentQuestion >= level.questions.length - 1) btn.textContent = '查看结果 🎯';
  else btn.textContent = '下一题 →';
  btn.classList.add('show');
}

function nextQuestion() {
  var level = LEVELS[currentLevel];
  if (currentQuestion >= level.questions.length - 1) { showResult(); return; }
  currentQuestion++;
  loadQuestion();
}

// ==================== 结果页 ====================
function showResult() {
  var level = LEVELS[currentLevel];
  var rate = totalPoints > 0 ? score / totalPoints : 0;
  var stars = rate >= 0.95 ? 3 : rate >= 0.7 ? 2 : rate >= 0.5 ? 1 : 0;
  if (!level.best || stars > level.best.stars) {
    level.best = { stars: stars, rate: Math.round(rate * 100) };
    saveProgress();
  }
  document.getElementById('result-emoji').textContent = stars === 3 ? '🏆' : stars >= 2 ? '🎉' : stars >= 1 ? '👍' : '💪';
  document.getElementById('result-title').textContent = stars === 3 ? '完美通关！' : stars >= 2 ? '做得不错！' : stars >= 1 ? '继续加油！' : '别灰心，再试一次！';
  document.getElementById('result-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  document.getElementById('result-desc').textContent = '第 ' + (currentLevel + 1) + ' 关 · ' + level.meta.name + ' — 得分 ' + score + ' / ' + totalPoints;
  var nb = document.getElementById('next-level-btn');
  if (currentLevel < LEVELS.length - 1) nb.style.display = 'inline-block';
  else nb.style.display = 'none';
  showPage('result-page');
}

function retryLevel() { startLevel(currentLevel); }
function nextLevel() {
  if (currentLevel < LEVELS.length - 1) startLevel(currentLevel + 1);
  else goHome();
}

// ==================== 语音 ====================
function playSound(text) {
  var sources = [
    'https://dict.youdao.com/dictvoice?audio=ENCODED&type=1',
    'https://fanyi.baidu.com/gettts?lan=en&text=ENCODED&spd=3&source=web'
  ];
  var idx = 0;
  var tryNext = function() {
    if (idx >= sources.length) {
      if ('speechSynthesis' in window) {
        try { speechSynthesis.cancel(); } catch(e) {}
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.9;
        speechSynthesis.speak(u);
      }
      return;
    }
    var url = sources[idx].replace('ENCODED', encodeURIComponent(text));
    idx++;
    var audio = new Audio();
    var p;
    try { audio.src = url; p = audio.play(); }
    catch(e) { tryNext(); return; }
    if (p && p.catch) p.catch(function(){ tryNext(); });
    audio.onerror = function(){ tryNext(); };
  };
  tryNext();
}

// ==================== 初始化 ====================
loadProgress();
</script>
</body></html>
