<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 4 · Like 语法大闯关</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Verdana', 'PingFang SC', sans-serif;
    background: #0F2B46;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
  }
  .home-link {
    color: #2DD4BF;
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 15px;
    display: inline-block;
  }
  .home-link:hover { text-decoration: underline; }
  .header {
    text-align: center;
    margin-bottom: 25px;
  }
  .header h1 {
    font-size: 24px;
    color: #2DD4BF;
    margin-bottom: 8px;
  }
  .header p {
    font-size: 14px;
    color: #94A3B8;
  }
  .level-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .level-tab {
    flex: 1;
    padding: 12px 8px;
    background: rgba(45, 212, 191, 0.1);
    border: 2px solid transparent;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 13px;
  }
  .level-tab.active {
    background: rgba(45, 212, 191, 0.2);
    border-color: #2DD4BF;
    color: #2DD4BF;
  }
  .level-tab.done {
    opacity: 0.6;
  }
  .level-tab .num {
    font-size: 18px;
    font-weight: bold;
    display: block;
    margin-bottom: 2px;
  }
  .card {
    background: #fff;
    color: #1E293B;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .card h2 {
    font-size: 18px;
    color: #0F2B46;
    margin-bottom: 15px;
    text-align: center;
  }
  .progress {
    text-align: center;
    color: #64748B;
    font-size: 13px;
    margin-bottom: 15px;
  }
  .question {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 20px;
    min-height: 50px;
  }
  .question .scene {
    display: block;
    font-size: 13px;
    color: #64748B;
    margin-bottom: 8px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    padding: 14px 18px;
    background: #F1F5F9;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 15px;
    text-align: left;
  }
  .option:hover {
    background: #E2E8F0;
    border-color: #2DD4BF;
  }
  .option.correct {
    background: #DCFCE7;
    border-color: #22C55E;
    color: #166534;
  }
  .option.wrong {
    background: #FEE2E2;
    border-color: #EF4444;
    color: #991B1B;
  }
  .option.disabled {
    pointer-events: none;
  }
  .fill-blank {
    display: inline-block;
    min-width: 80px;
    border-bottom: 2px solid #2DD4BF;
    padding: 2px 8px;
    color: #0F2B46;
    font-weight: bold;
  }
  .fill-input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #E2E8F0;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .fill-input:focus {
    border-color: #2DD4BF;
  }
  .submit-btn {
    width: 100%;
    padding: 14px;
    background: #2DD4BF;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .submit-btn:hover {
    background: #14B8A6;
  }
  .submit-btn:disabled {
    background: #CBD5E1;
    cursor: not-allowed;
  }
  .next-btn {
    width: 100%;
    padding: 14px;
    background: #0F2B46;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s;
  }
  .next-btn:hover {
    background: #1E3A5F;
  }
  .feedback {
    padding: 12px 16px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 14px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good {
    background: #DCFCE7;
    color: #166534;
  }
  .feedback.bad {
    background: #FEE2E2;
    color: #991B1B;
  }
  .result-card {
    text-align: center;
    padding: 40px 25px;
  }
  .result-card .score {
    font-size: 48px;
    font-weight: bold;
    color: #2DD4BF;
    margin: 15px 0;
  }
  .result-card .msg {
    font-size: 16px;
    color: #64748B;
    margin-bottom: 25px;
  }
  .result-card .retry-btn {
    padding: 14px 40px;
    background: #2DD4BF;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
  }
  .result-card .retry-btn:hover { background: #14B8A6; }
  .emoji { font-size: 28px; margin-bottom: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <a href="../../index.html" class="home-link">← 🏠 返回 PU1 主页</a>
  
  <div class="header">
    <h1>🍔 Like 语法大闯关</h1>
    <p>Unit 4 · 点餐餐厅主题</p>
  </div>

  <div class="level-tabs" id="levelTabs">
    <div class="level-tab active" data-level="0">
      <span class="num">1</span>
      点餐对话
    </div>
    <div class="level-tab" data-level="1">
      <span class="num">2</span>
      喜好调查
    </div>
    <div class="level-tab" data-level="2">
      <span class="num">3</span>
      综合挑战
    </div>
  </div>

  <!-- 游戏区域 -->
  <div id="gameArea">
    <div class="card">
      <h2 id="levelTitle">第一关：点餐对对碰</h2>
      <div class="progress" id="progress">第 1 / 8 题</div>
      <div class="question" id="question"></div>
      <div id="optionArea"></div>
      <div id="fillArea" class="hidden">
        <input type="text" class="fill-input" id="fillInput" placeholder="在这里输入答案...">
        <button class="submit-btn" id="submitBtn">提交答案</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn hidden" id="nextBtn">下一题 →</button>
    </div>
  </div>

  <!-- 结果区域 -->
  <div id="resultArea" class="hidden">
    <div class="card result-card">
      <div class="emoji" id="resultEmoji">🎉</div>
      <div style="font-size: 20px; color: #0F2B46; font-weight: bold;" id="resultTitle">闯关成功！</div>
      <div class="score"><span id="score">0</span> / <span id="total">0</span></div>
      <div class="msg" id="resultMsg"></div>
      <button class="retry-btn" onclick="restartLevel()">🔄 再玩一次</button>
      <button class="retry-btn" onclick="nextLevel()" id="nextLevelBtn">➡️ 下一关</button>
    </div>
  </div>
</div>

<script>
// 三关题目数据
const levels = [
  {
    title: '第一关：点餐对对碰',
    desc: '根据情景选择正确的句子',
    type: 'choice',
    questions: [
      {
        scene: '🍽️ 情景：服务员问你要不要面包',
        text: '______ some bread?  — Yes, please.',
        options: ['Do you like', 'Would you like', 'Can I have'],
        answer: 1,
        explain: '提供食物给别人用 Would you like...?'
      },
      {
        scene: '🍽️ 情景：你想喝果汁',
        text: '______ some juice, please?  — Sure. Here you are.',
        options: ['Can I have', 'Do you like', 'Would you like'],
        answer: 0,
        explain: '自己想要某物用 Can I have...?'
      },
      {
        scene: '🍎 情景：问朋友喜不喜欢苹果',
        text: '______ apples?  — Yes, I do.',
        options: ['Would you like', 'Can I have', 'Do you like'],
        answer: 2,
        explain: '问喜好（喜欢什么）用 Do you like...?'
      },
      {
        scene: '🍰 情景：你去同学家做客，阿姨给你蛋糕',
        text: '______ some cake?  — No, thanks. I\'m full.',
        options: ['Do you like', 'Would you like', 'Can I have'],
        answer: 1,
        explain: '主人给客人提供食物用 Would you like...?'
      },
      {
        scene: '🍗 情景：你在餐厅想点鸡肉',
        text: '______ some chicken, please?  — Sure.',
        options: ['Can I have', 'Do you like', 'Would you like'],
        answer: 0,
        explain: '点餐时自己要食物用 Can I have...?'
      },
      {
        scene: '🍇 情景：问同学喜不喜欢葡萄',
        text: '______ grapes?  — No, I don\'t.',
        options: ['Would you like', 'Do you like', 'Can I have'],
        answer: 1,
        explain: '问喜好（喜欢不喜欢）用 Do you like...?'
      },
      {
        scene: '🥗 情景：你饿了，朋友问你吃不吃沙拉',
        text: '______ some salad?  — Yes, please. I\'m hungry.',
        options: ['Can I have', 'Do you like', 'Would you like'],
        answer: 2,
        explain: '提供食物用 Would you like，回答是 Yes, please.'
      },
      {
        scene: '🍫 情景：你想吃巧克力',
        text: '______ some chocolate, please?  — Sorry, no.',
        options: ['Do you like', 'Would you like', 'Can I have'],
        answer: 2,
        explain: '请求要某物用 Can I have，否定回答是 Sorry, no.'
      }
    ]
  },
  {
    title: '第二关：喜好大调查',
    desc: '用正确的形式填空',
    type: 'fill',
    questions: [
      {
        text: 'I ______ apples. (like)',
        answer: 'like',
        explain: 'I 后面用原形 like'
      },
      {
        text: 'She ______ chocolate. (like)',
        answer: 'likes',
        explain: 'she 是第三人称单数，like 要加 s'
      },
      {
        text: 'He ______ bananas. (not like)',
        answer: "doesn't like",
        explain: 'he 三单否定用 doesn\'t like，like 用原形'
      },
      {
        text: 'We ______ grapes. (not like)',
        answer: "don't like",
        explain: 'we 是复数，否定用 don\'t like'
      },
      {
        text: 'Tom ______ meatballs. (like)',
        answer: 'likes',
        explain: 'Tom 是一个人，第三人称单数，用 likes'
      },
      {
        text: 'They ______ bread. (like)',
        answer: 'like',
        explain: 'they 是复数，用原形 like'
      },
      {
        text: 'My sister ______ salad. (not like)',
        answer: "doesn't like",
        explain: 'my sister 是第三人称单数，否定用 doesn\'t like'
      },
      {
        text: 'The cat ______ fish. (like)',
        answer: 'likes',
        explain: 'the cat 是 it，三单，like 加 s'
      }
    ]
  },
  {
    title: '第三关：综合大挑战',
    desc: '选择正确的答语',
    type: 'choice',
    questions: [
      {
        scene: '❓ 问句：Do you like apples?',
        text: '选择正确的回答：',
        options: ['Yes, please.', 'Yes, I do.', 'Sure.'],
        answer: 1,
        explain: 'Do you like 问喜好，回答用 Yes, I do. / No, I don\'t.'
      },
      {
        scene: '❓ 问句：Would you like some cake?',
        text: '选择正确的回答：',
        options: ['Yes, I do.', 'Yes, please.', 'Yes, I can.'],
        answer: 1,
        explain: 'Would you like 提供食物，回答用 Yes, please. / No, thanks.'
      },
      {
        scene: '❓ 问句：Can I have some juice?',
        text: '选择正确的回答：',
        options: ['Yes, I do.', 'No, thanks.', 'Sure. Here you are.'],
        answer: 2,
        explain: 'Can I have 请求食物，回答用 Sure. / Here you are.'
      },
      {
        scene: '❓ 问句：Does she like chocolate?',
        text: '选择正确的回答：',
        options: ['No, she doesn\'t.', 'No, thanks.', 'No, she don\'t.'],
        answer: 0,
        explain: 'Does she 问三单喜好，否定回答 No, she doesn\'t.'
      },
      {
        scene: '🍔 情景：你是服务员，给客人提供汉堡',
        text: '你应该说：',
        options: ['Do you like hamburgers?', 'Would you like a hamburger?', 'Can I have a hamburger?'],
        answer: 1,
        explain: '服务员提供食物用 Would you like...?'
      },
      {
        scene: '🍕 情景：你去朋友家，想吃披萨',
        text: '你应该说：',
        options: ['Do you like pizza?', 'Would you like some pizza?', 'Can I have some pizza?'],
        answer: 2,
        explain: '自己想吃，请求食物用 Can I have...?'
      },
      {
        scene: '👧 句子：She ______ ice cream.',
        text: '选择正确的词：',
        options: ['like', 'likes', 'don\'t like'],
        answer: 1,
        explain: 'she 是第三人称单数，用 likes'
      },
      {
        scene: '🥪 情景：问同学喜不喜欢三明治',
        text: '你应该说：',
        options: ['Do you like sandwiches?', 'Would you like sandwiches?', 'Can I have sandwiches?'],
        answer: 0,
        explain: '问喜好（喜欢不喜欢）用 Do you like...?'
      }
    ]
  }
];

let currentLevel = 0;
let currentQ = 0;
let score = 0;
let answered = false;

// 切换关卡标签
document.querySelectorAll('.level-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const level = parseInt(tab.dataset.level);
    if (level <= getMaxUnlockedLevel()) {
      loadLevel(level);
    }
  });
});

function getMaxUnlockedLevel() {
  const saved = localStorage.getItem('u4_grammar_max');
  return saved ? parseInt(saved) : 0;
}

function saveProgress(level) {
  const current = getMaxUnlockedLevel();
  if (level > current) {
    localStorage.setItem('u4_grammar_max', level);
  }
  updateTabs();
}

function updateTabs() {
  const max = getMaxUnlockedLevel();
  document.querySelectorAll('.level-tab').forEach((tab, i) => {
    if (i <= max) {
      tab.classList.add('done');
    }
  });
}

function loadLevel(levelIndex) {
  currentLevel = levelIndex;
  currentQ = 0;
  score = 0;
  answered = false;

  document.querySelectorAll('.level-tab').forEach((t, i) => {
    t.classList.toggle('active', i === levelIndex);
  });

  document.getElementById('levelTitle').textContent = levels[levelIndex].title;
  document.getElementById('gameArea').classList.remove('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  
  showQuestion();
}

function showQuestion() {
  const level = levels[currentLevel];
  const q = level.questions[currentQ];
  answered = false;

  document.getElementById('progress').textContent = `第 ${currentQ + 1} / ${level.questions.length} 题`;
  document.getElementById('feedback').classList.remove('show');
  document.getElementById('nextBtn').classList.add('hidden');

  const qEl = document.getElementById('question');
  if (q.scene) {
    qEl.innerHTML = `<span class="scene">${q.scene}</span>${q.text}`;
  } else {
    qEl.textContent = q.text;
  }

  const optionArea = document.getElementById('optionArea');
  const fillArea = document.getElementById('fillArea');

  if (level.type === 'choice') {
    optionArea.classList.remove('hidden');
    fillArea.classList.add('hidden');
    optionArea.innerHTML = '';

    q.options.forEach((opt, i) => {
      const btn = document.createElement('div');
      btn.className = 'option';
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(i, btn);
      optionArea.appendChild(btn);
    });
  } else {
    optionArea.classList.add('hidden');
    fillArea.classList.remove('hidden');
    document.getElementById('fillInput').value = '';
    document.getElementById('fillInput').focus();
  }
}

function checkAnswer(selectedIndex, btnElement) {
  if (answered) return;
  answered = true;

  const q = levels[currentLevel].questions[currentQ];
  const options = document.querySelectorAll('.option');
  
  options.forEach(opt => opt.classList.add('disabled'));

  if (selectedIndex === q.answer) {
    btnElement.classList.add('correct');
    score++;
    showFeedback('good', '✅ 答对啦！' + q.explain);
  } else {
    btnElement.classList.add('wrong');
    options[q.answer].classList.add('correct');
    showFeedback('bad', '❌ 不对哦～正确答案是：' + q.options[q.answer] + '\n' + q.explain);
  }

  document.getElementById('nextBtn').classList.remove('hidden');
}

document.getElementById('submitBtn').addEventListener('click', () => {
  if (answered) return;
  const input = document.getElementById('fillInput').value.trim().toLowerCase();
  const q = levels[currentLevel].questions[currentQ];
  const correct = q.answer.toLowerCase();
  
  answered = true;

  // 接受多种答案格式
  const userAnswer = input.replace(/\s+/g, ' ');
  const rightAnswer = correct.replace(/\s+/g, ' ');

  if (userAnswer === rightAnswer) {
    score++;
    showFeedback('good', '✅ 答对啦！' + q.explain);
  } else {
    showFeedback('bad', '❌ 不对哦～正确答案是：' + q.answer + '\n' + q.explain);
  }

  document.getElementById('nextBtn').classList.remove('hidden');
});

document.getElementById('fillInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('submitBtn').click();
  }
});

function showFeedback(type, text) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + type;
  fb.textContent = text;
}

document.getElementById('nextBtn').addEventListener('click', () => {
  currentQ++;
  if (currentQ >= levels[currentLevel].questions.length) {
    showResult();
  } else {
    showQuestion();
  }
});

function showResult() {
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('resultArea').classList.remove('hidden');

  const total = levels[currentLevel].questions.length;
  const percentage = score / total;

  document.getElementById('score').textContent = score;
  document.getElementById('total').textContent = total;

  let emoji, title, msg;
  if (percentage >= 0.8) {
    emoji = '🎉';
    title = '太棒了！';
    msg = '你掌握得非常好，继续保持！';
    if (currentLevel < levels.length - 1) {
      saveProgress(currentLevel + 1);
    }
  } else if (percentage >= 0.6) {
    emoji = '👍';
    title = '不错哦！';
    msg = '大部分都掌握了，再复习一下错题吧～';
    if (currentLevel < levels.length - 1) {
      saveProgress(currentLevel + 1);
    }
  } else {
    emoji = '💪';
    title = '再接再厉！';
    msg = '再多练几遍，一定可以的！';
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;

  // 最后一关隐藏下一关按钮
  document.getElementById('nextLevelBtn').style.display = 
    currentLevel >= levels.length - 1 ? 'none' : 'inline-block';
}

function restartLevel() {
  loadLevel(currentLevel);
}

function nextLevel() {
  if (currentLevel < levels.length - 1) {
    loadLevel(currentLevel + 1);
  }
}

// 初始化
updateTabs();
loadLevel(0);
</script>
</body>
</html>
